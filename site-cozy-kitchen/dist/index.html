<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5a65b">
  <meta name="description" content="暖暖小食堂——90秒限时出餐，挑战今日最高营业额。">
  <title>暖暖小食堂</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">暖</span><div><h1>暖暖小食堂</h1><p>今日菜单 · 第 <span id="day-number">1</span> 期</p></div></div>
      <button id="sound-btn" class="icon-btn" type="button" aria-label="切换声音">🔊</button>
    </header>

    <section id="start-screen" class="screen start-screen active">
      <div class="hero-card">
        <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="hero-bowl" aria-hidden="true">🍜</div>
        <span class="eyebrow">每日限时挑战</span>
        <h2>今天，也要让客人<br>吃得暖暖的</h2>
        <p>看订单、选食材、掌握火候，在 90 秒内完成更多菜品。</p>
        <div class="record"><span>本机最佳营业额</span><strong id="best-start">¥0</strong></div>
        <button id="start-btn" class="primary-btn" type="button">开门营业 <span>→</span></button>
      </div>
      <div class="how-to">
        <h3>三步出餐</h3>
        <div class="steps">
          <div><b>1</b><span>查看订单</span></div>
          <div><b>2</b><span>放入食材</span></div>
          <div><b>3</b><span>把握火候</span></div>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen">
      <div class="hud">
        <div><span>营业额</span><strong id="score">¥0</strong></div>
        <div class="timer-wrap"><span>剩余时间</span><strong id="timer">01:30</strong><div class="timer-track"><i id="timer-bar"></i></div></div>
        <div><span>连击</span><strong id="combo">×1</strong></div>
      </div>

      <div class="customer-area">
        <div id="customer" class="customer" aria-hidden="true"><span class="hair"></span><span class="face">•ᴗ•</span><span class="body"></span></div>
        <div class="order-card">
          <span class="order-label">本桌订单</span>
          <div class="dish-line"><span id="dish-emoji">🍳</span><div><h2 id="dish-name">番茄炒蛋</h2><p id="dish-hint">需要 2 种食材</p></div></div>
          <div id="order-ingredients" class="order-ingredients"></div>
          <div class="patience"><span>耐心</span><div><i id="patience-bar"></i></div></div>
        </div>
      </div>

      <div class="kitchen">
        <div class="counter-title"><span>备菜台</span><small>按订单选择食材</small></div>
        <div id="ingredients" class="ingredients"></div>
        <div class="cook-zone">
          <div class="pot-wrap">
            <div class="pot-lid"></div>
            <div id="pot" class="pot"><div id="pot-items" class="pot-items"><span class="empty-pot">等待食材…</span></div></div>
            <div id="flame" class="flame">🔥</div>
          </div>
          <div class="cook-panel">
            <div class="heat-header"><span>火候</span><strong id="heat-label">尚未开火</strong></div>
            <div class="heat-track"><span class="heat-good"></span><i id="heat-progress"></i></div>
            <button id="cook-btn" class="cook-btn" type="button" disabled>开始烹饪</button>
            <button id="serve-btn" class="serve-btn" type="button" disabled>现在出锅！</button>
            <button id="clear-btn" class="text-btn" type="button">清空锅子</button>
          </div>
        </div>
      </div>
      <div id="toast" class="toast" role="status"></div>
    </section>

    <section id="end-screen" class="screen end-screen">
      <div class="result-card">
        <span id="result-badge" class="result-badge">今日收摊</span>
        <div class="result-emoji">🧑‍🍳</div>
        <h2 id="result-title">辛苦啦，店长！</h2>
        <p>今天的小食堂充满了香气。</p>
        <div class="final-score"><span>今日营业额</span><strong id="final-score">¥0</strong><small id="new-record"></small></div>
        <div class="stats">
          <div><strong id="served-count">0</strong><span>成功出餐</span></div>
          <div><strong id="accuracy">0%</strong><span>出餐准确率</span></div>
          <div><strong id="max-combo">0</strong><span>最高连击</span></div>
        </div>
        <button id="share-btn" class="primary-btn" type="button">分享今日战绩</button>
        <button id="again-btn" class="secondary-btn" type="button">再营业一次</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
